name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = Maintenance LTS（engines 下限，require(esm) 自 22.12 起可用）
        # 24 = Active LTS；26 = Current。18/20 已 EOL，不再支持
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # npm ci 会触发 prepare → build，产物在测试前就已就位
      - name: Install
        run: npm ci

      - name: Lint & format check (Biome)
        run: npm run lint

      - name: Typecheck (src + test)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 单元/e2e 测 src；artifact.test.ts 测编译产物（零运行时依赖、shebang、
      # exports 完整性、真实 CLI 进程握手）——产物断言都在测试里，CI 不再重复写脚本
      - name: Test
        run: npm test

      - name: Package checks (publint + are-the-types-wrong)
        run: npm run check:package
