name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本项目零依赖（运行时与开发期均无），故不需要 install 步骤
      - name: Assert zero dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const rt = Object.keys(p.dependencies || {});
            const dev = Object.keys(p.devDependencies || {});
            if (rt.length || dev.length) {
              console.error('本项目必须保持零依赖（见 AGENT.md A1）:', { rt, dev });
              process.exit(1);
            }
            console.log('zero-dependency OK');
          "

      - name: Lint (syntax check)
        run: npm run lint

      - name: Test
        run: npm test
