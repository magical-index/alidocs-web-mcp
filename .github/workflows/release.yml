name: Release

# 触发方式：在 GitHub 上 Publish 一个 Release（tag 形如 v0.1.0）。
# 发布目标：
#   1. npm registry（registry.npmjs.org）—— 需要仓库 Secret：NPM_TOKEN
#   2. GitHub Packages（npm.pkg.github.com）—— 用内置 GITHUB_TOKEN
# 也支持手动触发（workflow_dispatch）用于补发。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # tag 与 package.json version 必须一致，避免误发错版本。
  # 手动触发（无 release 事件）时跳过该校验。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag ($tag) 与 package.json version ($pkg) 不一致"
            exit 1
          fi

  publish-npm:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance（npm 供应链溯源）需要
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@magical-index'

      # npm ci 会触发 prepare → build，产物在发布前就已就位
      - name: Install
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 发布到 GitHub Packages 需要
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@magical-index'

      - name: Install
        run: npm ci

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
